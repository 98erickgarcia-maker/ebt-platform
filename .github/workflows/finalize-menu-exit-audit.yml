name: Finalize reviewed keyboard exit audit
on:
  push:
    branches: ['test/flow-aura-deep-audit-20261009-1835']
    paths: ['.github/workflows/finalize-menu-exit-audit.yml']
permissions:
  contents: write
jobs:
  finalize:
    if: github.ref == 'refs/heads/test/flow-aura-deep-audit-20261009-1835'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Apply finite reviewed focus-exit fix and regression assertion
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          hook = Path('src/frontend/src/useMobileNavigation.ts')
          spec = Path('src/frontend/e2e/flow-aura-native-zoom.spec.ts')
          assert hashlib.sha256(hook.read_bytes()).hexdigest() == 'f9c1ef834e8ff79ac4523c609519ceb7f78a8c0f4bfa68469fb44a4309ca3bd1'
          assert hashlib.sha256(spec.read_bytes()).hexdigest() == '443d9f2ad6e8b33d467188b195867a41269ad943531b877e79f21256c571dace'
          s = hook.read_text(encoding='utf-8')
          old = '''    const outside = (target: EventTarget | null) =>
                target instanceof Node && !sidebar.contains(target) && target !== trigger;
              const leave = (event: FocusEvent) => {
                if (outside(event.target)) setOpen(false);
              };
              const pointer = (event: PointerEvent) => {
                if (outside(event.target) && !trigger?.contains(event.target as Node)) {
                  setOpen(false);
                }
              };
              const escape = (event: KeyboardEvent) => {
                if (event.key !== "Escape") return;'''
          new = '''    // A pointer click on the trigger must keep its normal toggle behavior.
              // Keyboard/programmatic focus returning there must close the covering panel.
              let pointerOnTrigger = false;
              const outside = (target: EventTarget | null) =>
                target instanceof Node && !sidebar.contains(target);
              const leave = (event: FocusEvent) => {
                const triggerPointerFocus = event.target === trigger && pointerOnTrigger;
                pointerOnTrigger = false;
                if (outside(event.target) && !triggerPointerFocus) setOpen(false);
              };
              const pointer = (event: PointerEvent) => {
                pointerOnTrigger = event.target instanceof Node && !!trigger?.contains(event.target);
                if (outside(event.target) && !pointerOnTrigger) setOpen(false);
              };
              const escape = (event: KeyboardEvent) => {
                pointerOnTrigger = false;
                if (event.key !== "Escape") return;'''
          assert s.count(old) == 1
          hook.write_text(s.replace(old, new), encoding='utf-8', newline='\n')
          s = spec.read_text(encoding='utf-8')
          old = '''      await page.keyboard.press("Tab");
              }
              await expect(page.locator("#ebt-sidebar-navigation")).toBeHidden();'''
          new = '''      await page.keyboard.press("Tab");
                const returnedToTrigger = await page.locator(".mobile-menu").evaluate(node => node === document.activeElement);
                if (returnedToTrigger) {
                  await expect(page.locator("#ebt-sidebar-navigation"), "Tab must not leave the trigger focused behind the open panel").toBeHidden();
                  await expect(opener).toBeFocused();
                }
              }
              await expect(page.locator("#ebt-sidebar-navigation")).toBeHidden();'''
          assert s.count(old) == 1
          spec.write_text(s.replace(old, new), encoding='utf-8', newline='\n')
          m = Path('planejamento/continuidade_github.json')
          data = json.loads(m.read_text(encoding='utf-8'))
          for p in (hook, spec):
            next(e for e in data['files'] if e['path'] == p.as_posix())['reviewed_sha256'] = hashlib.sha256(p.read_bytes()).hexdigest()
          m.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')
          Path('.github/workflows/finalize-menu-exit-audit.yml').unlink()
      - run: npm ci
        working-directory: src/frontend
      - run: npm run build && npm run test:unit
        working-directory: src/frontend
      - run: python scripts/verificar_continuidade.py
      - name: Save reviewed changes on isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- src/frontend/src/useMobileNavigation.ts src/frontend/e2e/flow-aura-native-zoom.spec.ts planejamento/continuidade_github.json .github/workflows/finalize-menu-exit-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(a11y): keep keyboard focus visible when leaving mobile navigation'
          git push origin HEAD:refs/heads/test/flow-aura-deep-audit-20261009-1835
          git archive --format=tar HEAD > "$RUNNER_TEMP/flow-aura-reviewed-source.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flow-aura-reviewed-source
          path: ${{ runner.temp }}/flow-aura-reviewed-source.tar
          retention-days: 1
          if-no-files-found: error

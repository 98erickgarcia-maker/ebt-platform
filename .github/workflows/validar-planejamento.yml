name: Validar planejamento EBT
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ler repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, conferido pela API GitHub
      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, conferido pela API GitHub
        with:
          python-version: '3.12'
      - name: Verificar orçamento e conteúdo documental
        run: python scripts/verificar_plano.py
      - name: Verificar organização e rastreabilidade
        run: python scripts/verificar_organizacao.py --no-write

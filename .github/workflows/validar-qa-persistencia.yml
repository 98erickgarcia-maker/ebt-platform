name: Validar persistência QA EBT

on:
  pull_request:
    paths:
      - "src/backend/**"
      - "tests/Ebt.Foundation.Tests/**"
      - ".github/workflows/validar-qa-persistencia.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090 # 2022-latest observado em 2026-10-07
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Developer"
          MSSQL_SA_PASSWORD: "EbtQa_${{ github.run_id }}!X"
        ports:
          - 1433:1433

      azurite:
        image: mcr.microsoft.com/azure-storage/azurite@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5 # 3.37.0
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002

    env:
      ASPNETCORE_ENVIRONMENT: QA
      EBT_QA_E2E: "1"
      EBT_QA_SQL_PASSWORD: "EbtQa_${{ github.run_id }}!X"
      EBT_QA_BLOB_CONNECTION: "UseDevelopmentStorage=true"
      EBT_QA_LOGIN_CODE: "EbtQaLogin_${{ github.run_id }}!X"
      QaPersistence__Enabled: "true"
      QaPersistence__SqlHost: "127.0.0.1"
      QaPersistence__SqlPort: "1433"
      QaPersistence__SqlUser: "sa"
      QaPersistence__DatabaseName: "EbtQa_${{ github.run_id }}"
      QaPersistence__BlobContainerName: "ebt-qa-${{ github.run_id }}"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restaurar e compilar
        run: |
          dotnet restore EBT.Platform.sln --nologo
          dotnet build EBT.Platform.sln --no-restore --nologo

      - name: Provar SQL e Blob reais de QA
        run: dotnet test EBT.Platform.sln --no-build --no-restore --nologo --filter "Category=QaPersistence"

      - name: Demonstrar API QA, health e salvar/reler
        shell: bash
        run: |
          set -euo pipefail

          dotnet run             --project src/backend/Ebt.Api/Ebt.Api.csproj             --no-build             --no-restore             --urls http://127.0.0.1:5080             > /tmp/ebt-api.log 2>&1 &

          api_pid=$!
          trap 'kill "$api_pid" >/dev/null 2>&1 || true' EXIT

          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS -D /tmp/health.headers               http://127.0.0.1:5080/health/ready               -o /tmp/health.json; then
              ready=1
              break
            fi

            if ! kill -0 "$api_pid" >/dev/null 2>&1; then
              cat /tmp/ebt-api.log
              exit 1
            fi

            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/ebt-api.log
            exit 1
          fi

          jq -e '.status == "healthy"
            and .dependencies.sql == "healthy"
            and .dependencies.blob == "healthy"
            and (.traceId | length) > 0' /tmp/health.json

          grep -qi '^x-trace-id:' /tmp/health.headers

          if grep -Eqi 'password|connectionstring|MSSQL_SA_PASSWORD|EBT_QA_SQL_PASSWORD|UseDevelopmentStorage' /tmp/health.json; then
            echo "Health expôs configuração sensível ou interna."
            exit 1
          fi

          login_payload=$(jq -n \
            --arg email "admin.orbe@demo.invalid" \
            --arg code "$EBT_QA_LOGIN_CODE" \
            '{email: $email, code: $code}')

          curl -fsS \
            -c /tmp/orbe.cookies \
            -H 'content-type: application/json' \
            -d "$login_payload" \
            http://127.0.0.1:5080/api/auth/qa-login \
            -o /dev/null

          curl -fsS \
            -b /tmp/orbe.cookies \
            -H 'X-EBT-TENANT: nexo' \
            http://127.0.0.1:5080/api/auth/me \
            | jq -e '.tenantKey == "orbe" and .role == "Administrator"'

          attachment=$(printf 'EBT QA G1' | base64 -w0)

          payload=$(jq -n             --arg tenantKey "orbe"             --arg title "Registro sintético via API"             --arg fileName "prova-api.txt"             --arg contentType "text/plain"             --arg content "$attachment"             '{
              tenantKey: $tenantKey,
              title: $title,
              attachmentFileName: $fileName,
              attachmentContentType: $contentType,
              attachmentBase64: $content
            }')

          created=$(curl -fsS \
            -b /tmp/orbe.cookies \
            -H 'content-type: application/json' \
            -d "$payload" \
            http://127.0.0.1:5080/api/foundation/records/)

          id=$(printf '%s' "$created" | jq -er '.id')
          printf '%s' "$created" | jq -e '.tenantKey == "orbe"
            and .title == "Registro sintético via API"
            and .attachment.fileName == "prova-api.txt"
            and .attachment.length == 9'

          curl -fsS \
            -b /tmp/orbe.cookies \
            "http://127.0.0.1:5080/api/foundation/records/$id" \
            | jq -e '.id != null and .tenantKey == "orbe" and .title == "Registro sintético via API"'

          curl -fsS \
            -b /tmp/orbe.cookies \
            "http://127.0.0.1:5080/api/foundation/records/$id/attachment" \
            -o /tmp/prova-api.txt

          test "$(cat /tmp/prova-api.txt)" = "EBT QA G1"

          nexo_login=$(jq -n \
            --arg email "admin.nexo@demo.invalid" \
            --arg code "$EBT_QA_LOGIN_CODE" \
            '{email: $email, code: $code}')

          curl -fsS \
            -c /tmp/nexo.cookies \
            -H 'content-type: application/json' \
            -d "$nexo_login" \
            http://127.0.0.1:5080/api/auth/qa-login \
            -o /dev/null

          status=$(curl -sS -o /tmp/cross-tenant.json -w '%{http_code}' \
            -b /tmp/nexo.cookies \
            "http://127.0.0.1:5080/api/foundation/records/$id")

          test "$status" = "404"

          curl -fsS \
            -b /tmp/nexo.cookies \
            http://127.0.0.1:5080/api/foundation/records/ \
            | jq -e 'length == 0'

      - name: Auditar dependências e diff
        run: |
          dotnet list EBT.Platform.sln package --vulnerable --include-transitive
          git diff --check

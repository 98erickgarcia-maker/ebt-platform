name: Finalize native zoom audit controller
on:
  push:
    branches: ['test/flow-aura-deep-audit-20261009-1835']
    paths: ['.github/workflows/finalize-native-zoom-audit.yml']
permissions:
  contents: write
jobs:
  finalize:
    if: github.ref == 'refs/heads/test/flow-aura-deep-audit-20261009-1835'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply exact reviewed test-only fix and update its one manifest entry
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          name = 'src/frontend/e2e/flow-aura-native-zoom.spec.ts'
          p = Path(name)
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'f1368bcdb518993a481fe5535e0b230a9ef44dee2a88a10d8c48da5b3c06ce3b'
          s = p.read_text(encoding='utf-8')
          old = 'await worker.evaluate(`async () => {'
          assert s.count(old) == 1 and s.count('      }`);') == 1
          s = s.replace(old, 'await worker.evaluate(`(async () => {').replace('      }`);', '      })()`);')
          p.write_text(s, encoding='utf-8', newline='\n')
          m = Path('planejamento/continuidade_github.json')
          data = json.loads(m.read_text(encoding='utf-8'))
          next(e for e in data['files'] if e['path'] == name)['reviewed_sha256'] = hashlib.sha256(p.read_bytes()).hexdigest()
          m.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')
          Path('.github/workflows/finalize-native-zoom-audit.yml').unlink()
      - run: python scripts/verificar_continuidade.py
      - name: Commit only the reviewed harness correction on the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- src/frontend/e2e/flow-aura-native-zoom.spec.ts planejamento/continuidade_github.json .github/workflows/finalize-native-zoom-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(ui): execute native browser zoom controller and keep CSP unchanged'
          git push origin HEAD:refs/heads/test/flow-aura-deep-audit-20261009-1835

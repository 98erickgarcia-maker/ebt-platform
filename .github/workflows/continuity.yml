name: Validate EBT Enterprise continuity
on:
  push:
    branches: ['codex/ebt-enterprise-continuity-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test checkpoints with local synthetic Git remote
        run: python -m unittest discover -s tests -p test_checkpoint_github.py -v
      - name: Verify continuity contract and reviewed content
        run: python scripts/verificar_continuidade.py
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD

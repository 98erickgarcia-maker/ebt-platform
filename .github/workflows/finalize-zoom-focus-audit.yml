name: Finalize reviewed native zoom focus correction
on:
  push:
    branches: ['test/flow-aura-deep-audit-20261009-1835']
    paths: ['.github/workflows/finalize-zoom-focus-audit.yml']
permissions:
  contents: write
jobs:
  finalize:
    if: github.ref == 'refs/heads/test/flow-aura-deep-audit-20261009-1835'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Apply exact reviewed focus correction and record geometry without weakening assertions
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          hook = Path('src/frontend/src/useMobileNavigation.ts')
          spec = Path('src/frontend/e2e/flow-aura-native-zoom.spec.ts')
          assert hashlib.sha256(hook.read_bytes()).hexdigest() == '018de7c18d709f4c6c5fa0dcd0c89ad31dd2136b7753b4fd4e6dbdea6e2a5982'
          assert hashlib.sha256(spec.read_bytes()).hexdigest() == '2267d15c398a1ac35e54c86e9f9ac19d6e6445ed1b7dbb62f9e7c9362c1a0c4c'
          s = hook.read_text(encoding='utf-8')
          old = '    active?.scrollIntoView({ block: "nearest", inline: "nearest" });'
          new = '    // Keep the focused item and its outline away from the viewport edge at 400% zoom.\n    active?.scrollIntoView({ block: "center", inline: "nearest" });'
          assert s.count(old) == 1
          hook.write_text(s.replace(old, new), encoding='utf-8', newline='\n')
          s = spec.read_text(encoding='utf-8')
          old = '''    const visible = await nav.locator('[aria-current="page"]').evaluate(node => {
                const box = node.getBoundingClientRect();
                return box.top >= 0 && box.bottom <= innerHeight;
              });
              expect(visible, "Focused navigation remains visible at native 400 percent zoom").toBe(true);'''
          new = '''    const focusedBox = await nav.locator('[aria-current="page"]').evaluate(node => {
                const box = node.getBoundingClientRect();
                return { top: box.top, bottom: box.bottom, height: innerHeight };
              });
              console.log(JSON.stringify({ scenario: "native-400-focus-geometry", ...focusedBox }));
              await page.screenshot({ path: path.join(evidence, "audit-native-menu-focus-400.png"), animations: "disabled" });
              expect(focusedBox.top >= 0 && focusedBox.bottom <= focusedBox.height,
                "Focused navigation remains visible at native 400 percent zoom").toBe(true);'''
          assert s.count(old) == 1
          spec.write_text(s.replace(old, new), encoding='utf-8', newline='\n')
          m = Path('planejamento/continuidade_github.json')
          data = json.loads(m.read_text(encoding='utf-8'))
          for p in (hook, spec):
            next(e for e in data['files'] if e['path'] == p.as_posix())['reviewed_sha256'] = hashlib.sha256(p.read_bytes()).hexdigest()
          m.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')
          Path('.github/workflows/finalize-zoom-focus-audit.yml').unlink()
      - run: npm ci
        working-directory: src/frontend
      - run: npm run build && npm run test:unit
        working-directory: src/frontend
      - run: python scripts/verificar_continuidade.py
      - name: Commit finite reviewed correction on the audit branch only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- src/frontend/src/useMobileNavigation.ts src/frontend/e2e/flow-aura-native-zoom.spec.ts planejamento/continuidade_github.json .github/workflows/finalize-zoom-focus-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(a11y): center mobile navigation focus in native 400 percent zoom'
          git push origin HEAD:refs/heads/test/flow-aura-deep-audit-20261009-1835

name: EBT VPS automation bundle tests
on:
  push:
    branches: [ops/ebt-vps-automation-bundle-20261010]
  pull_request:
    paths:
      - scripts/ops/install_ebt_vps_automation_bundle.sh
      - scripts/ops/collect_ebt_vps_automation_status.sh
      - scripts/ops/disable_ebt_vps_automation.sh
      - tests/ops/test_install_ebt_vps_automation_bundle.py
      - .github/workflows/ebt-vps-automation-bundle-tests.yml
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: bash -n scripts/ops/install_ebt_vps_automation_bundle.sh
      - run: bash -n scripts/ops/collect_ebt_vps_automation_status.sh
      - run: bash -n scripts/ops/disable_ebt_vps_automation.sh
      - run: python -m unittest discover -s tests/ops -p 'test_install_ebt_vps_automation_bundle.py' -v
      - name: Execute real public preflight with dummy root-only transport files
        run: |
          if ! id -u ebt-scout >/dev/null 2>&1; then
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin ebt-scout
          fi
          sudo install -d -o ebt-scout -g ebt-scout -m 0700 /var/lib/ebt-scout/.codex
          sudo install -o root -g root -m 0600 /dev/null /tmp/ebt-ci-dummy-key
          sudo install -o root -g root -m 0600 /dev/null /tmp/ebt-ci-dummy-known-hosts
          sudo env \
            GIT_KEY_PATH=/tmp/ebt-ci-dummy-key \
            KNOWN_HOSTS_PATH=/tmp/ebt-ci-dummy-known-hosts \
            bash scripts/ops/install_ebt_vps_automation_bundle.sh --check-only
      - run: git diff --check

name: EBT VPS automation bundle tests
on:
  push:
    branches: [ops/ebt-vps-automation-bundle-20261010]
  pull_request:
    paths:
      - scripts/ops/install_ebt_vps_automation_bundle.sh
      - scripts/ops/collect_ebt_vps_automation_status.sh
      - scripts/ops/disable_ebt_vps_automation.sh
      - tests/ops/test_install_ebt_vps_automation_bundle.py
      - .github/workflows/ebt-vps-automation-bundle-tests.yml
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: bash -n scripts/ops/install_ebt_vps_automation_bundle.sh
      - run: bash -n scripts/ops/collect_ebt_vps_automation_status.sh
      - run: bash -n scripts/ops/disable_ebt_vps_automation.sh
      - run: python -m unittest discover -s tests/ops -p 'test_install_ebt_vps_automation_bundle.py' -v
      - run: git diff --check

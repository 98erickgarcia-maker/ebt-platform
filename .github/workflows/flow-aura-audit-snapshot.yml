name: FLOW AURA audit source snapshot
on:
  push:
    branches: ['test/flow-aura-deep-audit-20261009-1835']
    paths: ['.github/workflows/flow-aura-audit-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked public source only, no credentials or runtime data
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/flow-aura-audit-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: flow-aura-audit-source
          path: ${{ runner.temp }}/flow-aura-audit-source.tar
          retention-days: 1
          if-no-files-found: error

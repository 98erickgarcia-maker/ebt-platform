name: EBT VPS product monitor tests
on:
  push:
    branches: [ops/ebt-production-watch-vps-20261010]
    paths:
      - scripts/ops/install_ebt_production_watch_vps.sh
      - templates/systemd/ebt-production-watch-vps.service
      - templates/systemd/ebt-production-watch-vps.timer
      - tests/ops/test_install_production_watch_vps.py
      - scripts/ops/production_watch.py
      - tests/ops/test_production_watch.py
      - .github/workflows/ebt-production-watch-vps-tests.yml
  pull_request:
    paths:
      - scripts/ops/install_ebt_production_watch_vps.sh
      - templates/systemd/ebt-production-watch-vps.service
      - templates/systemd/ebt-production-watch-vps.timer
      - tests/ops/test_install_production_watch_vps.py
      - scripts/ops/production_watch.py
      - tests/ops/test_production_watch.py
      - .github/workflows/ebt-production-watch-vps-tests.yml
permissions:
  contents: read
jobs:
  monitor-package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: bash -n scripts/ops/install_ebt_production_watch_vps.sh
      - run: python -m unittest discover -s tests/ops -p 'test_production_watch.py' -v
      - run: python -m unittest discover -s tests/ops -p 'test_install_production_watch_vps.py' -v
      - run: git diff --check

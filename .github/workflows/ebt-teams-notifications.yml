name: EBT Teams Notifications
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  workflow_run:
    workflows: ["EBT Production Watch", "Validar planejamento EBT"]
    types: [completed]
  issues:
    types: [opened, reopened, closed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ebt-teams-event-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.id || github.event.issue.number || github.sha }}
  cancel-in-progress: false
jobs:
  notify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.name != 'EBT Production Watch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout only trusted main code (never pull request code)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 pinned
        with:
          ref: main
          persist-credentials: false
      - name: Prepare Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 pinned
        with:
          python-version: '3.12'
      - name: Test notification formatter and sender
        run: python -m unittest discover -s tests/ops -p 'test_github_teams_notify.py' -v
      - name: Publish event to Teams Workflows
        env:
          TEAMS_WORKFLOWS_WEBHOOK_URL: ${{ secrets.TEAMS_WORKFLOWS_WEBHOOK_URL }}
        run: python scripts/ops/github_teams_notify.py

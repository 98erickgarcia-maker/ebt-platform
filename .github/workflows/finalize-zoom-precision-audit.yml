name: Finalize native zoom numerical precision
on:
  push:
    branches: ['test/flow-aura-deep-audit-20261009-1835']
    paths: ['.github/workflows/finalize-zoom-precision-audit.yml']
permissions:
  contents: write
jobs:
  finalize:
    if: github.ref == 'refs/heads/test/flow-aura-deep-audit-20261009-1835'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Correct only a floating-point comparison in the test
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json
          name = 'src/frontend/e2e/flow-aura-native-zoom.spec.ts'
          p = Path(name)
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'a5deaec8e20ef69a10afdb5886dedc8942537b7bc98ef42f103a966abbcb5995'
          s = p.read_text(encoding='utf-8')
          old = '      expect(actual).toBe(factor);'
          assert s.count(old) == 1
          s = s.replace(old, '      // Chromium represents 400 percent as 3.9999999999999996.\n      expect(actual).toBeCloseTo(factor, 10);')
          p.write_text(s, encoding='utf-8', newline='\n')
          m = Path('planejamento/continuidade_github.json')
          data = json.loads(m.read_text(encoding='utf-8'))
          next(e for e in data['files'] if e['path'] == name)['reviewed_sha256'] = hashlib.sha256(p.read_bytes()).hexdigest()
          m.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')
          Path('.github/workflows/finalize-zoom-precision-audit.yml').unlink()
      - run: python scripts/verificar_continuidade.py
      - name: Save test-only correction on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- src/frontend/e2e/flow-aura-native-zoom.spec.ts planejamento/continuidade_github.json .github/workflows/finalize-zoom-precision-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(ui): compare native zoom within numerical precision and retain DPR reflow checks'
          git push origin HEAD:refs/heads/test/flow-aura-deep-audit-20261009-1835

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n@sha256:526daa38b68e923cc00c5280d18b4da5d489f115a73bdbf3b8e452b184197a9a
    container_name: ebt-engineering-n8n
    restart: unless-stopped
    user: "1000:1000"
    network_mode: host
    env_file: /etc/ebt-engineering-n8n.env
    environment:
      N8N_LISTEN_ADDRESS: "127.0.0.1"
      N8N_PORT: "5678"
      N8N_HOST: "mcp.ebtenterprise.com.br"
      N8N_PROTOCOL: "https"
      N8N_EDITOR_BASE_URL: "https://mcp.ebtenterprise.com.br"
      N8N_MCP_BASE_URL: "https://mcp.ebtenterprise.com.br"
      N8N_WEBHOOK_URL: "https://mcp.ebtenterprise.com.br/"
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "true"
      GENERIC_TIMEZONE: "America/Sao_Paulo"
      TZ: "America/Sao_Paulo"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "1"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.readWriteFile","n8n-nodes-base.localFileTrigger"]'
    volumes:
      - /var/lib/ebt-engineering-n8n:/home/node/.n8n
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

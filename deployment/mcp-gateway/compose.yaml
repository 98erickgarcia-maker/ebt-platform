services:
  gateway:
    image: caddy@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    container_name: ebt-mcp-gateway
    restart: unless-stopped
    network_mode: host
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/letsencrypt-ebt-mcp:/etc/letsencrypt-ebt-mcp:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 192m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "https://mcp.ebtenterprise.com.br/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

; Manual desktop only: no Selenium Grid, recordings or WebDriver sessions.
[program:xvfb]
priority=0
command=/opt/bin/start-xvfb.sh
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:vnc]
priority=5
command=/opt/bin/start-vnc.sh
autostart=true
autorestart=true
startsecs=2
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:novnc]
priority=10
command=/opt/bin/start-novnc.sh
autostart=true
autorestart=true
startsecs=2
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:ebt-chat]
priority=15
command=/opt/ebt-launch-chat.sh
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/ebt-chat.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
